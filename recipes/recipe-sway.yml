
name: marschallos-sway
description: my personal image which is obviously the best.

base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - initial-setup
        - initial-setup-gui
        - initial-setup-gui-wayland-generic
        - fastfetch
        - foot
        - swayidle

  - type: systemd
    system:
      enabled:
        - initial-setup.service


  - type: brew
    nofile-limits: true
    brew-analytics: false

  - from-file: flatpaks-all.yml

  - type: signing