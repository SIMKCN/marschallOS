set $bg      #001524
set $teal    #15616d
set $cream   #ffecd1
set $accent  #ff7d00
set $brown   #78290f

set $mod Mod1
set $term foot
set $menu wofi --show drun


set $lock swaylock -f -c 001524 \
    --inner-color 001524 --ring-color 15616d --line-color 00000000 \
    --text-color ffecd1 --key-hl-color ff7d00 --bs-hl-color 78290f \
    --ring-ver-color ff7d00 --inner-ver-color 001524 --text-ver-color ffecd1 \
    --ring-wrong-color 78290f --inner-wrong-color 78290f --text-wrong-color ffecd1 \
    --indicator-radius 90 --indicator-thickness 8


font pango:Inter 10
titlebar_padding 10 4
titlebar_border_thickness 0
title_align center

default_border pixel 3
default_floating_border pixel 3
hide_edge_borders none

gaps inner 10
gaps outer 6

client.focused          $accent  $accent   $bg     $accent   $accent
client.focused_inactive $teal    $teal     $cream  $teal     $teal
client.unfocused        $teal    $bg       $teal   $bg       $teal
client.urgent           $brown   $brown    $cream  $brown    $brown
client.placeholder      $bg      $bg       $cream  $bg       $bg
client.background       $bg

output * bg $bg solid_color
seat * hide_cursor when-typing enable

input type:keyboard {
    xkb_layout de
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}

bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+q kill

bindsym $mod+Left  focus left
bindsym $mod+Down  focus down
bindsym $mod+Up    focus up
bindsym $mod+Right focus right
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+f fullscreen
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
floating_modifier $mod normal


bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'Sway beenden?' -B 'Ja' 'swaymsg exit'
bindsym $mod+Ctrl+l exec $lock

bar {
    swaybar_command waybar
}
exec swayidle -w \
    timeout 300 '$lock' \
    timeout 600 'swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"'